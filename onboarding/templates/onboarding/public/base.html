{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Personal details{% endblock %} · Botswana-UPenn Partnership</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F4F6FB; color: #1E2440; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 16px; line-height: 1.5; }
    .top { background: #fff; border-bottom: 3px solid #C9A84C; padding: 12px 20px; }
    .top img { height: 46px; width: auto; display: block; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 1.25; color: #1B2A6B; margin: 8px 0 6px; }
    .lead { color: #5A6385; margin: 0 0 18px; }
    .msg { border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; background: #FBE4E4; color: #6E1818; border: 1px solid #D99A9A; }
    .msg.success { background: #DDF1EE; color: #0A5C52; border-color: #9ED3CB; }
    .foot { text-align: center; color: #5A6385; font-size: 13px; padding: 8px 16px 32px; }
  </style>
</head>
<body>
  <div class="top"><img src="{% static 'finance/bup_logo.png' %}" alt="Botswana-UPenn Partnership"></div>
  <main class="wrap">
    {% if messages %}{% for m in messages %}<div class="msg {{ m.tags }}" role="status">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <div class="foot">Botswana-UPenn Partnership · Your details are seen only by BUP Human Resources.</div>
</body>
</html>
