{% extends 'base.html' %}
{% block title %}New Document{% endblock %}

{% block content %}
<div class="page-title">New Finance Document</div>
<div class="card">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Title</label>
        {{ form.title }}
      </div>
      <button type="submit" class="btn btn-primary">Create &amp; Start Building</button>
    </form>
  </div>
</div>
{% endblock %}
